<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MANYMITE AI — opening console…</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
  body{font-family:Geist,'Segoe UI',system-ui,sans-serif;background:#090A0F;color:#e2e1ed;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
  .card{text-align:center;max-width:420px;padding:2rem}
  .bolt{width:56px;height:56px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-size:26px;background:linear-gradient(135deg,#00d2ff,#3B82F6);box-shadow:0 0 30px rgba(0,210,255,.4);margin-bottom:1rem}
  h1{font-size:1.3rem;margin:.5rem 0}
  p{color:#859399;font-size:.9rem;line-height:1.6}
  .bar{height:3px;width:220px;background:#1F293D;border-radius:2px;margin:1.2rem auto;overflow:hidden}
  .bar i{display:block;height:100%;width:40%;background:#00d2ff;border-radius:2px;animation:slide 1.2s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(280%)}}
  .err{color:#F43F5E;display:none;margin-top:1rem}
  a{color:#00d2ff}
</style>
</head>
<body>
<div class="card">
  <div class="bolt">⚡</div>
  <h1>MANYMITE AI Console</h1>
  <div class="bar"><i></i></div>
  <p id="msg">Finding the live AI link…</p>
  <p class="err" id="err">Couldn't reach the AI right now — the home PC may be off, or the link is rotating.<br><br><a href="#" onclick="location.reload();return false">Retry now</a></p>
</div>
<script>
const msg = document.getElementById('msg'), err = document.getElementById('err');
async function go(){
  msg.textContent = 'Finding the live AI link…'; err.style.display = 'none';
  try{
    const r = await fetch('https://ntfy.sh/buffy-devalerts-x7k2/json?poll=1&since=24h', {cache:'no-store', credentials:'omit'});
    const best = {A:0,B:0}; let link = null;
    for (const line of (await r.text()).split('\n')){
      if (!line.trim()) continue;
      let m; try{ m = JSON.parse(line); }catch(e){ continue; }
      if (m.event !== 'message') continue;
      const u = (m.message||'').match(/https:\/\/[a-z0-9.-]+\.run\.pinggy-free\.link/i);
      if (!u) continue;
      const t = m.title||'';
      if (/link A/i.test(t) && m.time > best.A){ best.A = m.time; link = u[0]; }
      if (/link B/i.test(t) && m.time > best.B){ best.B = m.time; link = u[0]; }
    }
    if (!link) throw new Error('no live link');
    msg.textContent = 'Live link found — opening the console…';
    location.replace(link.replace(/\/+$/,'') + '/chat.html');
  }catch(e){
    msg.textContent = ''; err.style.display = 'block';
    setTimeout(go, 8000);
  }
}
go();
</script>
</body>
</html>
